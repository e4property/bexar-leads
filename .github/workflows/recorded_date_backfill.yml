name: Recorded Date Backfill

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  deployments: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install selenium webdriver-manager --break-system-packages -q

      - name: Run recorded date backfill
        env:
          CLERK_EMAIL: ${{ secrets.CLERK_EMAIL }}
          CLERK_PASSWORD: ${{ secrets.CLERK_PASSWORD }}
        run: python scraper/recorded_date_backfill.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/records.json data/records.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "backfill: recorded dates for existing NOF/TAX leads"
          for i in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push origin main && echo "Push succeeded" && break
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Clear stuck Pages deployments
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" | grep -o '"sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "cancel $sha -> $code"
          done
          sleep 5
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: pages_try1
        continue-on-error: true
      - name: Clear stuck Pages deployments (retry)
        if: steps.pages_try1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" | grep -o '"sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "cancel $sha -> $code"
          done
          sleep 5
      - name: Deploy to GitHub Pages (retry)
        if: steps.pages_try1.outcome == 'failure'
        uses: actions/deploy-pages@v4

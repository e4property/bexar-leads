name: Loan Amount Backfill

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml selenium pytesseract pillow

      - name: Run loan amount backfill
        env:
          CLERK_EMAIL: "${{ secrets.CLERK_EMAIL }}"
          CLERK_PASSWORD: "${{ secrets.CLERK_PASSWORD }}"
        run: python scraper/loan_backfill.py

      - name: Commit updated records.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/e4property/bexar-leads.git
          git add dashboard/records.json data/records.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "backfill: loan amount enrichment"
          for i in 1 2 3 4 5; do
            sleep $((RANDOM % 10 + 2))
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push origin main && echo "Push succeeded" && break
            echo "Attempt $i failed, retrying..."
          done

name: Purge Past Auctions + Deploy

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run purge script
        run: python scraper/purge_past_auctions.py

      - name: Commit updated records.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/e4property/bexar-leads.git
          git add dashboard/records.json data/records.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "purge: remove past-auction leads"
          for i in 1 2 3 4 5; do
            sleep $((RANDOM % 10 + 2))
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push origin main && echo "Push succeeded" && break
            echo "Attempt $i failed, retrying..."
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Clean up stale github-pages artifacts
        env:
          GH_TOKEN: "${{ secrets.GH_PAT }}"
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' | \
          while read -r id; do
            echo "Deleting stale github-pages artifact id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

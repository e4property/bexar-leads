name: Purge Past Auctions + Deploy

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      deployments: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run purge script
        run: python scraper/purge_past_auctions.py

      - name: Commit updated records.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/e4property/bexar-leads.git
          git add dashboard/records.json data/records.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "purge: remove past-auction leads"
          for i in 1 2 3 4 5; do
            sleep $((RANDOM % 10 + 2))
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            git push origin main && echo "Push succeeded" && break
            echo "Attempt $i failed, retrying..."
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Clean up stale github-pages artifacts
        env:
          GH_TOKEN: "${{ secrets.GH_PAT }}"
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' | \
          while read -r id; do
            echo "Deleting stale github-pages artifact id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Clear stuck Pages deployments
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" | grep -o '"sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "cancel $sha -> $code"
          done
          sleep 5
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: pages_try1
        continue-on-error: true
      - name: Clear stuck Pages deployments (retry)
        if: steps.pages_try1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" | grep -o '"sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "cancel $sha -> $code"
          done
          sleep 5
      - name: Deploy to GitHub Pages (retry)
        if: steps.pages_try1.outcome == 'failure'
        uses: actions/deploy-pages@v4

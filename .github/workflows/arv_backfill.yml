name: ARV Backfill (manual)
on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Backfill leads with run_ts on/after this date (YYYY-MM-DD)'
        required: false
        default: '2026-08-07'

permissions:
  contents: write

jobs:
  arv-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ARV backfill
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: python scraper/backfill_arv.py "${{ github.event.inputs.since }}"

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          python scraper/merge_dashboard_status.py origin/main || true
          git add dashboard/records.json data/records.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "arv: backfill since ${{ github.event.inputs.since }}"
          for i in 1 2 3; do
            git fetch origin main
            python scraper/merge_dashboard_status.py origin/main || true
            git add dashboard/records.json 2>/dev/null || true
            git diff --cached --quiet || git commit --amend --no-edit
            git rebase -X ours origin/main || git rebase --abort
            git push origin main && echo "Push succeeded" && break
            echo "Attempt $i failed, retrying..."
            sleep 3
          done

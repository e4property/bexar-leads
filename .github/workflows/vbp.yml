name: VBP + CE Cross-Reference
on:
  schedule:
    - cron: '0 16 2 * *'   # 2nd of every month at 11am CDT
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full CE check even if VBP unchanged (true/false)'
        required: false
        default: 'false'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: vbp-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  vbp-ce-scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pdfplumber requests --break-system-packages -q

      - name: Force CE check if requested
        if: github.event.inputs.force == 'true'
        run: |
          echo "Force flag set — resetting last_run in vbp_state.json"
          python3 -c "
          import json, pathlib
          p = pathlib.Path('data/vbp_state.json')
          if p.exists():
              s = json.loads(p.read_text())
              s['last_run'] = ''
              s['last_vbp_count'] = 0
              p.write_text(json.dumps(s, indent=2))
              print('Reset vbp_state.json last_run and last_vbp_count')
          else:
              print('No vbp_state.json found — will create fresh on run')
          "

      - name: Run VBP + CE scraper
        id: vbp
        run: |
          python scraper/vbp_scraper.py 2>&1 | tee /tmp/vbp.log
          NEW=$(grep -oP '(?<=Added )\d+(?= stacked VBP\+CE)' /tmp/vbp.log | tail -1 || echo "0")
          CLEANED=$(grep -oP '(?<=Cleaned stacked flag from )\d+' /tmp/vbp.log | tail -1 || echo "0")
          STAMPED=$(grep -oP '(?<=Stamped stacked:true on )\d+' /tmp/vbp.log | tail -1 || echo "0")
          CHANGED=$(( ${NEW:-0} + ${CLEANED:-0} + ${STAMPED:-0} ))
          echo "new_leads=${NEW:-0}" >> $GITHUB_OUTPUT
          echo "cleaned=${CLEANED:-0}" >> $GITHUB_OUTPUT
          echo "stamped=${STAMPED:-0}" >> $GITHUB_OUTPUT
          echo "changed=${CHANGED}" >> $GITHUB_OUTPUT
          echo "Summary: new=${NEW:-0} cleaned=${CLEANED:-0} stamped=${STAMPED:-0} changed=${CHANGED}"

      - name: Commit results
        # 2026-09-10: was gated on steps.vbp.outputs.changed != '0', which
        # comes from three regexes matching specific log phrases (e.g.
        # "Added N stacked VBP+CE") that don't match what the script
        # actually logs now ("17 new VBP+CE leads added") -- confirmed
        # live, a run that found 17 new leads computed changed=0 and
        # skipped this entire step, silently discarding that run's work
        # when the runner shut down. No way to know how long this had
        # been happening. Removed that gate here and switched Upload/
        # Deploy below to check whether a commit actually happened
        # instead -- `git diff --cached --quiet` is the real check, not
        # a fragile log-message regex.
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scraper/merge_dashboard_status.py origin/main || true
          git add dashboard/records.json data/vbp_state.json
          if git diff --cached --quiet; then
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "vbp: $(date -u +'%Y-%m-%d') — ${{ steps.vbp.outputs.new_leads }} new | ${{ steps.vbp.outputs.stamped }} stamped | ${{ steps.vbp.outputs.cleaned }} cleaned"
            for i in 1 2 3; do
              git fetch origin main
              python scraper/merge_dashboard_status.py origin/main || true
              git add dashboard/records.json
              git diff --cached --quiet || git commit --amend --no-edit
              git rebase -X ours origin/main || git rebase --abort
              git push origin main && echo "Push succeeded" && break
              echo "Push attempt $i failed, retrying..."
              sleep 3
            done
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload Pages artifact
        if: steps.commit.outputs.committed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.committed == 'true'
        uses: actions/deploy-pages@v4

name: Scrape & Enrich Leads
on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        run: pip install requests selenium webdriver-manager

      - name: Create output directories
        run: mkdir -p data dashboard

      - name: Run scraper
        id: scraper
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: |
          python scraper/fetch.py 2>&1 | tee /tmp/scraper.log
          NEW_TOTAL=$(grep -oP '(?<=PublicSearch: )\d+(?= total new)' /tmp/scraper.log | tail -1 || echo "0")
          CE_COUNT=$(grep -oP '(?<=Code Enforcement added )\d+' /tmp/scraper.log | tail -1 || echo "0")
          DANG_COUNT=$(grep -oP '(?<=dangerous premises: )\d+' /tmp/scraper.log | tail -1 || echo "0")
          FINAL_TOTAL=$(grep -oP '(?<=Final: )\d+(?= total)' /tmp/scraper.log | tail -1 || echo "0")
          MORTGAGE_CT=$(grep -oP '(?<=Mortgage intel: )\d+' /tmp/scraper.log | tail -1 || echo "0")
          echo "new_total=${NEW_TOTAL:-0}" >> $GITHUB_OUTPUT
          echo "ce_count=${CE_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "dang_count=${DANG_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "final_total=${FINAL_TOTAL:-0}" >> $GITHUB_OUTPUT
          echo "mortgage_ct=${MORTGAGE_CT:-0}" >> $GITHUB_OUTPUT

      - name: Show summary
        run: python3 scraper/summary.py

      - name: Verify dashboard
        run: |
          ls -lh dashboard/
          wc -c dashboard/records.json

      - name: Commit records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git stash || true
          git rebase origin/main || true
          git stash pop || true
          git add data/records.json dashboard/records.json
          git diff --cached --quiet || git commit -m "chore: update leads $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify via GHL SMS
        if: always()
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          NOTIFY_PHONE: ${{ secrets.NOTIFY_PHONE }}
        run: |
          NEW="${{ steps.scraper.outputs.new_total }}"
          CE="${{ steps.scraper.outputs.ce_count }}"
          DANG="${{ steps.scraper.outputs.dang_count }}"
          TOTAL="${{ steps.scraper.outputs.final_total }}"
          MORT="${{ steps.scraper.outputs.mortgage_ct }}"
          NEW=${NEW:-0}; CE=${CE:-0}; DANG=${DANG:-0}; TOTAL=${TOTAL:-0}; MORT=${MORT:-0}

          if [ "$NEW" -gt "0" ] || [ "$CE" -gt "0" ]; then
            MSG="Bexar Leads: ${NEW} new foreclosure, ${CE} code enforce"
            if [ "$DANG" -gt "0" ]; then MSG="${MSG} !! ${DANG} DANGEROUS PREMISES"; fi
            MSG="${MSG}. ${MORT} w/mortgage intel. ${TOTAL} total. Check dash."
          else
            MSG="Bexar scrape done. No new leads. ${MORT} w/mortgage intel. ${TOTAL} on file."
          fi

          # Step 1: look up contact by phone to get contactId
          PHONE_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$NOTIFY_PHONE'))")
          CONTACT_RESP=$(curl -s \
            "https://services.leadconnectorhq.com/contacts/?locationId=$GHL_LOCATION_ID&query=$PHONE_ENCODED" \
            -H "Authorization: Bearer $GHL_API_KEY" \
            -H "Version: 2021-07-28") || true

          CONTACT_ID=$(echo "$CONTACT_RESP" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            contacts=d.get('contacts',d.get('data',[]))
            if contacts: print(contacts[0].get('id',''))
          except: pass
          " 2>/dev/null || true)

          if [ -n "$CONTACT_ID" ]; then
            # Send via conversation using contactId
            PAYLOAD=$(python3 -c "import json; print(json.dumps({
              'type':'SMS',
              'contactId':'$CONTACT_ID',
              'message':'$MSG'
            }))")
            RESP=$(curl -s -w "\n%{http_code}" \
              -X POST "https://services.leadconnectorhq.com/conversations/messages" \
              -H "Authorization: Bearer $GHL_API_KEY" \
              -H "Content-Type: application/json" \
              -H "Version: 2021-07-28" \
              -d "$PAYLOAD") || true
            echo "SMS via contactId response: $RESP"
          else
            # Fallback: send directly by phone number
            PAYLOAD=$(python3 -c "import json; print(json.dumps({
              'type':'SMS',
              'locationId':'$GHL_LOCATION_ID',
              'toNumber':'$NOTIFY_PHONE',
              'message':'$MSG'
            }))")
            RESP=$(curl -s -w "\n%{http_code}" \
              -X POST "https://services.leadconnectorhq.com/conversations/messages/outbound" \
              -H "Authorization: Bearer $GHL_API_KEY" \
              -H "Content-Type: application/json" \
              -H "Version: 2021-07-28" \
              -d "$PAYLOAD") || true
            echo "SMS fallback response: $RESP"
          fi

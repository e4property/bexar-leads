name: Scrape and Deploy
on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    # 2026-10-01: moved from ubuntu-latest to a self-hosted runner on Xavi's
    # own machine. Root-caused that the SUSPICIOUS STOP pagination failure
    # (page 1 full, page 2 empty on the current week's chunk -- confirmed
    # firing on essentially every run for a week straight) only happens from
    # GitHub's hosted-runner IP pool -- the identical request, from this
    # machine's own connection, has worked every single time it's been
    # tested, including through a real GitHub Actions job (see
    # test-selfhosted.yml). This machine must be on and this runner process
    # running for the scrape to execute -- see runner_output.log in
    # C:\gh-actions-runner\bexar-leads for its status.
    runs-on: [self-hosted, Windows, local]
    environment:
      name: github-pages
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"

      # 2026-10-01: Python/Chrome/Tesseract are already installed on this
      # self-hosted machine (unlike a fresh ubuntu-latest VM each run) --
      # setup-python and apt-get are neither needed nor available on
      # Windows. Just register Tesseract's install directory on PATH for
      # this job (GITHUB_PATH persists it across every step below).
      - name: Register Tesseract on PATH
        shell: bash
        run: echo "/c/Program Files/Tesseract-OCR" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        run: pip install requests beautifulsoup4 lxml selenium pytesseract pillow homeharvest

      - name: Run python scraper/fetch.py
        id: scrape
        shell: bash
        env:
          CLERK_EMAIL: "${{ secrets.CLERK_EMAIL }}"
          CLERK_PASSWORD: "${{ secrets.CLERK_PASSWORD }}"
          # 2026-10-01: headed mode alone also did NOT fix SUSPICIOUS
          # STOP (confirmed live) -- now testing whether the automation-
          # masking flags themselves (spoofed UA, excludeSwitches, etc.)
          # are the actual tell, since every successful manual test this
          # session used a plain, unmodified browser.
          SELENIUM_HEADLESS: "false"
          SELENIUM_PLAIN: "true"
        run: python scraper/fetch.py

      # 2026-08-28: this script existed but was never actually wired into
      # anything -- its own docstring said "run manually via
      # workflow_dispatch," but it was never dispatched either. 520 dead,
      # already-past-auction leads piled up silently over time and only
      # became visible all at once when the scraper backlog-recovery fix
      # (recordedDateRange switch) surfaced them as "new" leads. Runs now
      # every scrape so this can't recur.
      - name: Purge past-auction leads
        shell: bash
        run: python scraper/purge_past_auctions.py

      - name: Commit records
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          python scraper/merge_dashboard_status.py origin/main || true
          git add dashboard/records.json data/records.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update leads $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            sleep $((RANDOM % 10 + 2))
            git fetch origin main
            python scraper/merge_dashboard_status.py origin/main || true
            git add dashboard/records.json 2>/dev/null || true
            git diff --cached --quiet || git commit --amend --no-edit
            git rebase -X ours origin/main || git rebase --abort
            git push origin main && echo "Push succeeded" && break
            echo "Attempt $i failed, retrying..."
          done

      # 2026-10-01: gh CLI isn't installed on this self-hosted Windows
      # machine -- switched to the same curl + token pattern used
      # elsewhere in this project instead of `gh api`.
      - name: Clean up stale github-pages artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print(a['id']) for a in d['artifacts'] if a['name']=='github-pages']" | \
          while read -r id; do
            echo "Deleting stale github-pages artifact id=$id"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - uses: actions/deploy-pages@v4

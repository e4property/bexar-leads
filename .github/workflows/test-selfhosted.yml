name: Test Self-Hosted Runner
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, Windows, local]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Check environment (bash)
        shell: bash
        run: |
          echo "Running on self-hosted runner"
          python3 --version
          "/c/Program Files/Tesseract-OCR/tesseract.exe" --version | head -1
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://bexar.tx.publicsearch.us/results?department=FC&recordedDateRange=20260923%2C20260930&keywordSearch=false&limit=50&offset=50&sort=desc&sortBy=recordedDate&sortDir=desc&searchType=advancedSearch"

      - name: Check page 2 content (the actual failing request)
        shell: bash
        run: |
          curl -s "https://bexar.tx.publicsearch.us/results?department=FC&recordedDateRange=20260923%2C20260930&keywordSearch=false&limit=50&offset=50&sort=desc&sortBy=recordedDate&sortDir=desc&searchType=advancedSearch" | grep -o "1-50 of [0-9]*\|51-100 of [0-9]*\|No Results" | head -5

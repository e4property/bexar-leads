name: Deploy Dashboard Only

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as scrape.yml/probate.yml/vbp.yml -- GitHub Pages deployments
# must be serialized, cancel-in-progress:false so a manual dashboard-only
# deploy never clobbers a scrape run's deploy (or vice versa) mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - uses: actions/deploy-pages@v4

name: Appointment Scrape and Deploy
on:
  schedule:
    - cron: '0 12 * * *'   # 7am CDT (12:00 UTC) daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  deployments: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  appointment-scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests selenium webdriver-manager --break-system-packages -q

      - name: Run appointment scraper
        id: appt
        run: |
          python scraper/run_appointment.py 2>&1 | tee /tmp/appt.log
          NEW=$(grep -oP '(?<=new_count=)\d+' /tmp/appt.log | tail -1 || echo "0")
          echo "new_count=${NEW:-0}" >> $GITHUB_OUTPUT
          echo "Summary: new=${NEW:-0}"

      - name: Commit results
        if: steps.appt.outputs.new_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main && break
            echo "Rebase attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          git add dashboard/records.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "appointment: $(date -u +'%Y-%m-%d') — ${{ steps.appt.outputs.new_count }} new pre-foreclosure records"
          for i in 1 2 3; do
            git push origin main && break
            echo "Push attempt $i failed, retrying..."
            git fetch origin main
            git rebase -X theirs origin/main || git rebase --abort
            sleep 3
          done

      - name: Clean up stale github-pages artifacts
        if: steps.appt.outputs.new_count != '0'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' | \
          while read -r id; do
            echo "Deleting stale github-pages artifact id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - name: Upload Pages artifact
        if: steps.appt.outputs.new_count != '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Clear stuck Pages deployments
        if: steps.appt.outputs.new_count != '0'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" | grep -o '"sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "cancel $sha -> $code"
          done
          sleep 5
      - name: Deploy to GitHub Pages
        if: steps.appt.outputs.new_count != '0'
        uses: actions/deploy-pages@v4
        id: pages_try1
        continue-on-error: true
      - name: Clear stuck Pages deployments (retry)
        if: steps.pages_try1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" | grep -o '"sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "cancel $sha -> $code"
          done
          sleep 5
      - name: Deploy to GitHub Pages (retry)
        if: steps.pages_try1.outcome == 'failure'
        uses: actions/deploy-pages@v4

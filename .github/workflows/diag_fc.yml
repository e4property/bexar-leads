name: Diag FC page 1 (one-off)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml selenium pytesseract pillow
      - name: Diagnose
        run: python scraper/diag_fc.py

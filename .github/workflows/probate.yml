name: Probate Scrape and Deploy
# 2026-08-29: schedule disabled -- confirmed via diagnostic audit that
# department=PR isn't a valid department on this PublicSearch instance for
# Bexar (it doesn't even appear as a selectable option in the site's own
# Advanced Search UI, and every live request against it times out without
# resolving to either real results or a genuine "No Results" state). Zero
# probate records have ever been captured, ever, across the life of this
# scraper -- it's been running daily for nothing. Left as workflow_dispatch
# only so it can be re-enabled once/if a real data source for Bexar probate
# records is found (likely a separate Probate Court system, not this
# County Clerk recording portal).
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: probate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probate-scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests selenium webdriver-manager --break-system-packages -q

      - name: Run probate scraper
        id: probate
        run: |
          python scraper/run_probate.py 2>&1 | tee /tmp/probate.log
          NEW=$(grep -oP '(?<=Probate scrape: )\d+(?= new)' /tmp/probate.log | tail -1 || echo "0")
          echo "new_count=${NEW:-0}" >> $GITHUB_OUTPUT
          echo "Summary: new=${NEW:-0}"

      - name: Commit results
        if: steps.probate.outputs.new_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scraper/merge_dashboard_status.py origin/main || true
          git add dashboard/records.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "probate: $(date -u +'%Y-%m-%d') — ${{ steps.probate.outputs.new_count }} new records"
          for i in 1 2 3; do
            git fetch origin main
            python scraper/merge_dashboard_status.py origin/main || true
            git add dashboard/records.json
            git diff --cached --quiet || git commit --amend --no-edit
            git rebase -X ours origin/main || git rebase --abort
            git push origin main && echo "Push succeeded" && break
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done

      - name: Upload Pages artifact
        if: steps.probate.outputs.new_count != '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        if: steps.probate.outputs.new_count != '0'
        uses: actions/deploy-pages@v4

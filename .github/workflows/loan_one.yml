name: Loan Lookup (one doc)

on:
  workflow_dispatch:
    inputs:
      doc_number:
        description: "NOF (Foreclosures dept) doc number, e.g. 20261100114 (optional if ref_doc given)"
        required: false
        default: ""
      ref_doc:
        description: "Land Records doc number to capture, e.g. the Deed of Trust (optional)"
        required: false
        default: ""

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml selenium pytesseract pillow

      - name: Capture document pages
        env:
          CLERK_EMAIL: "${{ secrets.CLERK_EMAIL }}"
          CLERK_PASSWORD: "${{ secrets.CLERK_PASSWORD }}"
          DOC_NUMBER: "${{ github.event.inputs.doc_number }}"
          REF_DOC: "${{ github.event.inputs.ref_doc }}"
        run: python scraper/loan_one.py

      - name: Upload page images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-pages
          path: out/
          retention-days: 2

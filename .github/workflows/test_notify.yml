name: Test Foreclosure SMS Alert
on:
  workflow_dispatch:

jobs:
  test-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Write fake test record
        run: |
          mkdir -p /tmp/test
          cat > /tmp/test/records.json <<'EOF'
          [
            {
              "type": "NOF",
              "is_new": true,
              "address": "123 Test St",
              "owner": "Test Owner",
              "score": 99
            }
          ]
          EOF

      - name: Run notify script against fake record
        env:
          GHL_API_KEY: "${{ secrets.GHL_API_KEY }}"
          RECORDS_PATH: /tmp/test/records.json
        run: python scraper/notify_foreclosure.py
